[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeapi-visualizer"
version = "0.1.0"
description = "Tkinter GUI for exporting FreeLLMAPI error logs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{"name": "Amin M", "email": "your.email@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "tkinter",
    "streamlit",
    "plotly",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
